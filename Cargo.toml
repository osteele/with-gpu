[package]
name = "with-gpu"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
authors = ["Oliver Steele <steele@osteele.com>"]
description = "Intelligent GPU selection wrapper for CUDA commands"
license = "MIT"
repository = "https://github.com/osteele/with-gpu"
homepage = "https://github.com/osteele/with-gpu"
keywords = ["gpu", "cuda", "nvidia", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "with-gpu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.12"
# Later 0.19 releases require Rust 1.88 through libloading 0.9.
cudarc = { version = "=0.19.9", default-features = false, features = ["driver", "cuda-12000", "dynamic-loading"] }
